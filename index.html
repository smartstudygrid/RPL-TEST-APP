<style id="css-squad">
*{box-sizing:border-box}

function sqCrop(file,ratio,circle){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onerror=()=>{URL.revokeObjectURL(url);rej();};
    im.onload=()=>{
      const W=300,H=Math.round(W/ratio);
      const ov=document.createElement("div");ov.className="modal";
      ov.innerHTML=`<div class="mb"><div class="mt">Frame face + shoulders</div><canvas width="${W}" height="${H}" class="cv ${circle?"rc":""}"></canvas><input type="range" id="z" min="1" max="6" step="0.01" value="1"><div class="hint">Drag to move · slider or scroll to zoom</div><div style="display:flex;gap:10px"><button class="btn sec auto" id="cx">Cancel</button><button class="btn auto" id="ck">Use photo</button></div></div>`;
      document.body.append(ov);
      const c=ov.querySelector("canvas"),g=c.getContext("2d"),zs=ov.querySelector("#z");
      const base=Math.max(W/im.width,H/im.height);
      let z=1,x=0,y=0,drag=null;
      const draw=()=>{const s=base*z,mx=(im.width*s-W)/2,my=(im.height*s-H)/2;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));g.fillStyle="#000";g.fillRect(0,0,W,H);g.drawImage(im,W/2+x-im.width*s/2,H/2+y-im.height*s/2,im.width*s,im.height*s);};
      const done=v=>{URL.revokeObjectURL(url);ov.remove();res(v);};
      zs.oninput=()=>{z=+zs.value;draw();};
      c.onwheel=e=>{e.preventDefault();z=Math.min(6,Math.max(1,z-e.deltaY*.003));zs.value=z;draw();};
      c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);};
      c.onpointermove=e=>{if(!drag)return;const k=W/c.getBoundingClientRect().width;x+=(e.clientX-drag[0])*k;y+=(e.clientY-drag[1])*k;drag=[e.clientX,e.clientY];draw();};
      c.onpointerup=()=>drag=null;
      ov.querySelector("#cx").onclick=()=>done(null);
      ov.querySelector("#ck").onclick=()=>done(c.toDataURL("image/jpeg",.72).split(",")[1]);
      draw();
    };
    im.src=url;
  });
}

// ================= SCORER (ported, admin-only delete kept) =================
const scWk=m=>(m.history||[]).filter(x=>x.w).length;
function scInfo(m){
  const maxb=m.overs*6,w=scWk(m),inn=m.innings||1;
  const first=m.bat1===2?m.n2:m.n1,second=m.bat1===2?m.n1:m.n2;
  const bat=inn===1?first:second,bowl=inn===1?second:first;
  const i1over=inn===1&&(m.balls>=maxb||w>=10);
  const done=inn===2&&(m.runs>m.inn1||m.balls>=maxb||w>=10);
  let res="";
  if(done){
    if(m.runs>m.inn1)res=`${bat} won by ${10-w} wicket${10-w>1?"s":""}`;
    else if(m.runs<m.inn1)res=`${bowl} won by ${m.inn1-m.runs} run${m.inn1-m.runs>1?"s":""}`;
    else res="Match tied";
  }
  return{maxb,w,inn,bat,bowl,i1over,done,res};
}
function scTicker(m,ov){
  const i=scInfo(m),ws=i.bat.trim().split(/\s+/),cls="tk"+(ov?" ov":"");
  if(i.done)return`<div class="${cls}" style="justify-content:center"><i class="gb"></i><div class="res">🏆 ${esc(i.res.toUpperCase())}</div></div>`;
  const need=m.inn1-m.runs+1;
  const chase=ov&&i.inn===2?`<u></u><div class="tc"><small style="color:#ffd700">CHASE</small><div class="os" style="font-size:18px;font-weight:700;color:${need>0?"#ff6b6b":"#6fcf97"}">${Math.max(0,need)} off ${Math.max(0,i.maxb-m.balls)}</div></div>`:"";
  return`<div class="${cls}"><i class="gb"></i><div class="tc tm"><b>${esc((ws[0]||"").toUpperCase())}</b><span>${esc((ws[1]||"").toUpperCase())}</span></div><u></u><div class="tc"><div class="sc">${m.runs}/${i.w}</div></div><u></u><div class="tc"><small>OVERS</small><div class="ov2">${ovs(m.balls)}</div></div><u></u><div class="tc"><div class="mx">(${String(m.overs).padStart(2,"0")})</div></div>${chase}</div>`;
}
const scBStat=(h,n)=>{let r=0,b=0;h.forEach(x=>{if(x.s===n){r+=x.br||0;if(x.e!=="wd")b++;}});return[r,b];};
const scWStat=(h,n)=>{let r=0,b=0,w=0;h.forEach(x=>{if(x.o===n){r+=x.r;b+=x.b;if(x.w&&x.k!=="ro")w++;}});return`${Math.floor(b/6)}.${b%6}-${r}-${w}`;};
function scPlayers(m){
  const c=m.cur;if(!c||(!c.s&&!c.n&&!c.b)||scInfo(m).done)return"";
  const st=n=>{if(!n)return"";const[r,b]=scBStat(m.history,n);return`<span>${n===c.s?"▶ ":""}<b>${esc(n)}</b> ${r}(${b})</span>`;};
  return`<div class="pl">${st(c.s)}${st(c.n)}${c.b?`<span>⚾ <b>${esc(c.b)}</b> ${scWStat(m.history,c.b)}</span>`:""}</div>`;
}
function scPoints(){
  if(!ScS.tour)return`<div class="mut c" style="margin:24px 0">Select a tournament above.</div>`;
  const T={},row=(id,n)=>T[id]??={n,p:0,w:0,l:0,t:0,pts:0,rf:0,bf:0,ra:0,ba:0};
  const ms=ScMatches.filter(m=>m.tid===ScS.tour);
  ms.forEach(m=>{row(m.t1,m.n1);row(m.t2,m.n2);});
  ms.filter(m=>m.status==="completed").forEach(m=>{
    const f=m.bat1===2?2:1,a=row(f===1?m.t1:m.t2),b=row(f===1?m.t2:m.t1);
    a.p++;b.p++;
    if(m.runs>m.inn1){b.w++;a.l++;b.pts+=2;}else if(m.runs<m.inn1){a.w++;b.l++;a.pts+=2;}else{a.t++;b.t++;a.pts++;b.pts++;}
    if(m.inn1b!=null){const mb=m.overs*6,ab=m.inn1w>=10?mb:m.inn1b,bb=(m.history||[]).filter(x=>x.w).length>=10?mb:m.balls;a.rf+=m.inn1;a.bf+=ab;a.ra+=m.runs;a.ba+=bb;b.rf+=m.runs;b.bf+=bb;b.ra+=m.inn1;b.ba+=ab;}

  const KINDS=[["b","Bowled"],["c","Caught"],["lbw","LBW"],["ro","Run Out"],["st","Stumped"],["hw","Hit Wicket"],["rtd","Retired Out"],["rth","Retired Hurt"]];
  const sel=(id,arr)=>`<select id="${id}">${arr.map(p=>`<option>${esc(p)}</option>`).join("")}</select>`;
  const outUI=()=>ScS.out==="menu"?`<div class="xm"><h3>HOW OUT?</h3><div class="xg" style="grid-template-columns:repeat(2,1fr)">${KINDS.map(([k,t])=>`<button class="sb" style="font-size:17px" data-ok="${k}">${t}</button>`).join("")}</div><button class="btn s" id="oc">Cancel</button></div>`:`<div class="xm"><h3>${KINDS.find(x=>x[0]===ScS.out)[1].toUpperCase()}</h3>${["ro","rtd","rth"].includes(ScS.out)?`<label>${ScS.out==="ro"?"Batter out":"Batter"}</label>${sel("od",cb2)}`:""}${ScS.out==="ro"?`<label>Runs completed</label><select id="orr">${[0,1,2,3].map(v=>`<option>${v}</option>`).join("")}</select>`:""}${["c","st","ro"].includes(ScS.out)?fsel:""}<button class="btn" id="ocf">Confirm</button><button class="btn s" id="oc">Cancel</button></div>`;
  const cbUI=()=>`<div class="xm"><h3>CHANGE BATTER</h3><label>Replace</label>${sel("cr",cb2)}<label>With</label>${sel("cw",xiB.filter(p=>!outs.has(p)&&p!==c.s&&p!==c.n))}<button class="btn" id="cbc">Confirm</button><button class="btn s" id="cbx">Cancel</button></div>`;
  let h=`<div class="w"><div class="top"><button class="btn s sm" id="bk">← Matches</button><a class="btn s sm" target="_blank" href="https://wa.me/?text=${encodeURIComponent(view)}">📲 Share</a></div><div class="mut c" style="margin-bottom:6px">${esc(tname(m.tid))} · ${m.overs} overs${m.when?" · "+when(m.when):""}</div>`;
  if(m.status==="scheduled"){
    h+=`<div class="card" style="cursor:default"><div class="vs c"><b>${esc(m.n1)}</b> vs <b>${esc(m.n2)}</b></div><div class="mut c">${esc(m.venue||"")}</div></div>`;
    if(A)h+=`${P?scSquadPick(m,1)+scSquadPick(m,2):""}<button class="btn" id="st">Start Match</button>`;
    else h+=`<div class="tg">Match not started yet</div>`;
  }else{
    h+=scTicker(m)+scPlayers(m);
    if(m.innings===2&&!i.done){const need=m.inn1-m.runs+1;h+=`<div class="tg">${need>0?`🎯 Need ${need} runs in ${ovs(i.maxb-m.balls)} overs`:"✅ Target achieved!"}</div>`;}
    if(i.i1over){
      h+=`<div class="card" style="cursor:default;text-align:center"><div class="os gold" style="font-size:24px">Innings Over</div><div class="os" style="font-size:44px">${m.runs}/${i.w}</div><div class="mut">${esc(i.bat)} — 1st innings</div><div>${esc(i.bowl)} to chase</div></div>`;
      if(A)h+=`<button class="btn" id="s2">Start 2nd Innings</button><button class="btn s" id="un">↩ Undo last ball</button>`;
    }else if(stage==="open"){
      h+=`<div class="xm"><h3>OPENING PLAYERS</h3><label>Striker</label>${sel("ps",xiB)}<label>Non-striker</label>${sel("pn",xiB)}<label>Opening bowler</label>${sel("pb",xiW)}<button class="btn" id="cf">Confirm</button></div>`;
    }else if(stage==="bat"){
      const av=xiB.filter(p=>!outs.has(p)&&p!==c.s&&p!==c.n);
      h+=`<div class="xm"><h3>NEW BATTER</h3>${sel("pa",av)}<button class="btn" id="cf">Confirm</button></div><button class="btn s" id="un">↩ Undo last ball</button>`;
    }else if(stage==="bowl"){
      h+=`<div class="xm"><h3>BOWLER FOR OVER ${Math.floor(m.balls/6)+1}</h3>${sel("pb2",xiW.filter(p=>p!==c.lb))}<button class="btn" id="cf">Confirm</button></div><button class="btn s" id="sw">⇄ Switch Strike</button><button class="btn s" id="un">↩ Undo last ball</button>`;
    }else if(A&&!i.done){
      h+=ScS.out?outUI():ScS.cb?cbUI():ScS.ex?`<div class="xm"><h3>WIDE BALLS</h3><div class="xg" style="grid-template-columns:repeat(5,1fr)">${[0,1,2,3,4].map(v=>`<button class="sb" data-xk="wd" data-xv="${v}">W+${v}</button>`).join("")}</div><h3>NO BALLS</h3><div class="xg" style="grid-template-columns:repeat(6,1fr)">${[0,1,2,3,4,6].map(v=>`<button class="sb" data-xk="nb" data-xv="${v}">N+${v}</button>`).join("")}</div><button class="btn s" id="xc">Cancel</button></div>`:`<div class="g4">${[0,1,2,3].map(v=>`<button class="sb" data-r="${v}">${v}</button>`).join("")}</div><div class="g4"><button class="sb f" data-r="4">4</button><button class="sb s6" data-r="6">6</button><button class="sb o" id="out">OUT</button><button class="sb u" id="un">UNDO</button></div><button class="sb" id="ex" style="width:100%;margin:0 0 8px;font-size:18px;letter-spacing:2px">ADD EXTRAS</button>${c?`<div class="g2"><button class="btn s" id="sw">⇄ Switch Strike</button><button class="btn s" id="cb">✎ Change Batter</button></div>`:""}`;
    }else if(A&&i.done)h+=`<button class="btn s" id="un">↩ Undo last ball</button>`;
    if(!i.done)h+=`<div class="mut c">Live — updates automatically</div>`;
    h+=`<details id="sd" class="mut" style="margin-top:12px" ${(ScS.sumOpen??(m.status==="completed"||ScS.sumParam))?"open":""}><summary>📊 Match Summary</summary><div style="margin-top:8px">${scSummary(m)}<div style="display:flex;gap:8px;margin-top:8px"><a class="btn s sm" target="_blank" href="https://wa.me/?text=${encodeURIComponent(scSummaryText(m,view+"&summary=1"))}">📲 Share Summary</a><button class="btn s sm" id="dls">📥 Download Image</button></div></div></details>`;
    if(m.xi1)h+=`<details class="mut" style="margin-top:10px"><summary>Playing XIs &amp; 12th players</summary>${[1,2].map(k=>`<div style="margin-top:6px"><b>${esc(m["n"+k])}</b>: ${esc((m["xi"+k]||[]).join(", "))}<br>12th: ${esc(m["s"+k]||"–")}</div>`).join("")}</details>`;
  }
  if(A)h+=`<button class="btn s" id="cp" style="margin-top:14px">📋 Copy Overlay Link</button><div class="mut c" style="word-break:break-all;font-size:11px">${esc(ov)}</div>`;
  h+=`</div>`;
  const y=scrollY;
  scRoot().innerHTML=h+`<div id="msg" class="msg"></div>`;
  scrollTo(0,y);
  if(A&&m.status==="live")scLock();
  if($("#pn"))$("#pn").selectedIndex=Math.min(1,$("#pn").options.length-1);
  scRoot().querySelector("#bk").onclick=scList;
  if($("#sd"))$("#sd").ontoggle=()=>{ScS.sumOpen=$("#sd").open;};
  const on=(s,fn)=>{const e=scRoot().querySelector(s);if(e)e.onclick=fn;};
  on("#st",()=>{
    const u={status:"live",innings:1,runs:0,balls:0,history:[],cur:null};
    if(P){for(const k of[1,2]){if(ScS.sel[k].length!==Math.min(11,m["pl"+k].length))return scFlash("Select the playing XI for both teams.");u["xi"+k]=ScS.sel[k];u["s"+k]=ScS.sub[k]||"";}}
    const ovEl=document.createElement("div");ovEl.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px";
    ovEl.innerHTML=`<div class="xm" style="width:100%;max-width:420px"><h3>WHO IS BATTING FIRST?</h3><button class="btn" data-bf="1">${esc(m.n1)}</button><button class="btn" data-bf="2">${esc(m.n2)}</button><button class="btn s" data-bf="0">Cancel</button></div>`;
    ovEl.onclick=e=>{const b=e.target.closest("[data-bf]");if(!b)return;ovEl.remove();if(b.dataset.bf==="0")return;u.bat1=+b.dataset.bf;scAct(()=>updateDoc(scRef(m.id),u));};
    document.body.appendChild(ovEl);
  });
  on("#s2",()=>scAct(()=>updateDoc(scRef(m.id),{innings:2,inn1:m.runs,inn1w:i.w,inn1b:m.balls,hist1:m.history,runs:0,balls:0,history:[],cur:null})));
  on("#cf",()=>{
    if(stage==="open"){const s=$("#ps").value,n=$("#pn").value;if(s===n)return scFlash("Striker and non-striker must be different.");scAct(()=>updateDoc(scRef(m.id),{cur:{s,n,b:$("#pb").value,lb:null}}));}
    else if(stage==="bat"){const p=$("#pa").value;if(p)scAct(()=>updateDoc(scRef(m.id),{cur:{...c,[c.s?"n":"s"]:p}}));}
    else scAct(()=>updateDoc(scRef(m.id),{cur:{...c,b:$("#pb2").value}}));
  });
  on("#out",()=>{if(c){ScS.out="menu";scMatchView();}else scBall("",0,1);});
  on("#un",scUndo);on("#oc",()=>{ScS.out=null;scMatchView();});
  scRoot().querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const k=b.dataset.ok;if(["b","lbw","hw"].includes(k)){ScS.out=null;scWicket(k,c.s);}else{ScS.out=k;scMatchView();}});
  on("#ocf",()=>{const k=ScS.out,d=$("#od")?$("#od").value:c.s,f=$("#fl")?$("#fl").value||null:null,v=k==="ro"?+$("#orr").value:0;ScS.out=null;if(k==="rtd"||k==="rth")scRetire(k,d);else scWicket(k,d,v,f);});
  on("#sw",()=>scAct(()=>updateDoc(scRef(m.id),{cur:{...c,s:c.n,n:c.s}})));
  on("#cb",()=>{ScS.cb=true;scMatchView();});on("#cbx",()=>{ScS.cb=false;scMatchView();});
  on("#cbc",()=>{const r=$("#cr").value,w=$("#cw").value;if(!w)return scFlash("No batter available.");ScS.cb=false;scAct(()=>updateDoc(scRef(m.id),{cur:{...c,[c.s===r?"s":"n"]:w}}));});
  on("#ex",()=>{ScS.ex=true;scMatchView();});on("#xc",()=>{ScS.ex=false;scMatchView();});
  on("#cp",e=>navigator.clipboard.writeText(ov).then(()=>{e.target.textContent="✅ Copied!";setTimeout(()=>e.target.textContent="📋 Copy Overlay Link",2000);}));
  on("#dls",()=>scDownloadSummaryImage(m));
  scRoot().querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>scBall("",+b.dataset.r,0));
  scRoot().querySelectorAll("[data-xk]").forEach(b=>b.onclick=()=>{ScS.ex=false;scBall(b.dataset.xk,+b.dataset.xv,0);});
  scRoot().querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,p=b.dataset.p,a=ScS.sel[k],need=Math.min(11,m["pl"+k].length);
    if(a.includes(p))ScS.sel[k]=a.filter(x=>x!==p);
    else if(a.length<need){a.push(p);if(ScS.sub[k]===p)ScS.sub[k]="";}
    scMatchView();
  });
  scRoot().querySelectorAll("[data-sub]").forEach(s=>s.onchange=()=>{ScS.sub[s.dataset.sub]=s.value;});
}
function scSquadPick(m,k){
  const pl=m["pl"+k],sel=ScS.sel[k],need=Math.min(11,pl.length),rest=pl.filter(p=>!sel.includes(p));
  return`<div class="xm"><h3>${esc(m["n"+k])} — PLAYING XI (${sel.length}/${need})</h3><div class="chips">${pl.map(p=>`<button class="chip ${sel.includes(p)?"on":""}" data-k="${k}" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div><label>12th player</label><select data-sub="${k}"><option value="">— none —</option>${rest.map(p=>`<option ${ScS.sub[k]===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>`;
}
function scBar(m){
  const i=scInfo(m),h=m.history,c=m.cur||{};
  if(m.status==="scheduled"||i.done){
    const txt=i.done?`🏆 ${esc(i.res)}`:`${esc(m.n1)} v ${esc(m.n2)}`;
    const sub=i.done?`${esc(m.bat1===2?m.n2:m.n1)} ${m.inn1}/${m.inn1w??0} · ${esc(i.bat)} ${m.runs}/${i.w}`:esc(when(m.when));
    return`<div class="ob" style="height:5rem"><div class="ob1"><div class="lp"><div class="tm"><b style="font:700 3.4rem/1 Oswald">${esc(abbr(m.n1))}</b></div></div><div class="bn"><b>${txt}</b><span>${sub}</span></div><div class="rp"><div class="tm"><b style="font:700 3.4rem/1 Oswald;color:#fff">${esc(abbr(m.n2))}</b></div></div></div></div>`;
  }
  const fig=n=>{let r=0,b=0,w=0;h.forEach(x=>{if(x.o===n){r+=x.r;b+=x.b;if(x.w&&x.k!=="ro")w++;}});return`${w}-${r}<small>(${Math.floor(b/6)}.${b%6})</small>`;};
  let ov=[],lc=0,full=false;
  h.forEach(x=>{if(x.e==="ret")return;if(full){ov=[];full=false;}ov.push(x);if(x.b&&++lc%6===0)full=true;});
  const cc=x=>x.w?`<i class="cw">W</i>`:x.e==="wd"?`<i class="cx">Wd${x.r>1?x.r-1:""}</i>`:x.e==="nb"?`<i class="cx">Nb${x.r>1?x.r-1:""}</i>`:x.r===4||x.r>=6?`<i class="cg">${x.r}</i>`:x.r===0?`<i class="c0">•</i>`:`<i>${x.r}</i>`;
  const circ=ov.map(cc);while(circ.length<6)circ.push(`<i class="e"></i>`);
  const first=[];h.forEach(x=>{if(x.p)x.p.slice(0,2).forEach(n=>n&&!first.includes(n)&&first.push(n));});
  const idx=n=>first.includes(n)?first.indexOf(n):99;
  const bs=[c.s,c.n].filter(Boolean).sort((a,b)=>idx(a)-idx(b));
  const kb=i.inn===1?(m.bat1===2?2:1):(m.bat1===2?1:2);
  const pic=n=>{const p=(ScS.pics[kb]||{})[n];return p?`<span class="ph"><img src="data:image/jpeg;base64,${p}"></span>`:"";};
  const bt=n=>{const[r,b]=scBStat(h,n);return`<div class="bt"><span class="nm"><u class="${n===c.s?"on":""}"></u>${esc(n)}</span>${pic(n)}<span class="rn">${r}<small>(${b})</small></span></div>`;};
  const crr=m.balls?(m.runs/(m.balls/6)).toFixed(2):"0.00";
  const left=i.maxb-m.balls;
  let mid="";
  if(i.inn===1){const proj=crr>0?Math.round((crr*m.overs)).toFixed(0):m.runs;mid=`CRR ${crr} · PROJ ${proj}`;}
  else{const need=m.inn1-m.runs+1;const rrr=left>0&&need>0?(need/(left/6)).toFixed(2):"0.00";const needTxt=need>0?`NEED ${need} OFF ${left}`:"TARGET ACHIEVED";mid=`CRR ${crr} · RRR ${rrr} · <span style="color:#ffd700">TGT ${m.inn1+1}</span> · ${needTxt}`;}
  return`<div class="ob"><div class="ob1"><div class="lp"><div class="tm"><b style="font:700 3.4rem/1 Oswald">${esc(abbr(i.bat))}</b></div></div><div class="sc">${m.runs}-${i.w}</div><div class="ovs"><small>OVERS</small><b>${ovs(m.balls)}</b><i>(${m.overs})</i></div>${[0,1].map(k=>bs[k]?bt(bs[k]):`<div class="bt"></div>`).join("")}<div class="rp"><div class="tm"><b style="font:700 3.4rem/1 Oswald;color:#fff">${esc(abbr(i.bowl))}</b></div></div></div><div class="ob2"><div class="to">THIS<br>OVER</div><div class="cs">${circ.join("")}</div><div class="mid">${mid}</div><div class="bw">${esc((c.b||"—").toUpperCase())}${c.b?`<em>${fig(c.b)}</em>`:""}</div></div></div>`;
}
async function scLoadPics(m){
  if(ScS.picsFor===m.id)return;ScS.picsFor=m.id;ScS.pics={1:{},2:{}};
  for(const k of[1,2]){
    if(!m["t"+k])continue;
    try{const d=(await getDoc(doc(db,"squads",m["t"+k]))).data()||{};(d.player_list||[]).forEach((n,i)=>{const p=(d.squad_pics||{})[i];if(n&&p)ScS.pics[k][n]=p;});if(d.captain_name&&d.cap_pic)ScS.pics[k][d.captain_name]=d.cap_pic;}catch{}
  }
}
function scOverlay(id){
  CurView="overlay";document.body.dataset.view="overlay";
  document.documentElement.classList.add("ovh");document.body.classList.add("ovb");
  $("#home-app").hidden=true;$("#squad-app").hidden=true;$("#scorer-app").hidden=false;
  const sq=$("#css-squad");if(sq)sq.disabled=true;const sc=$("#css-scorer");if(sc)sc.disabled=false;
  let last=null;const draw=()=>{scRoot().innerHTML=`<div class="w">`+(last?scBar(last):"")+`</div>`;};
  onSnapshot(scRef(id),s=>{
    if(!s.exists()){last=null;return draw();}
    last={...s.data(),id:s.id,history:s.data().history||[]};draw();
    if(ScS.picsFor!==s.id)scLoadPics(last).then(draw);
  });
}

// ---------- BOOT (overlay + match compat) ----------
const q=new URLSearchParams(location.search),mid=(q.get("match")||"").trim().toUpperCase();
if(q.get("mode")==="overlay"&&mid){scOverlay(mid);}
else{
  await auth.authStateReady?.();
  await refreshRole(auth.currentUser);
  await loadTours();await sqLoadTeams();
  ScS.sumParam=q.get("summary")==="1";
  if(mid&&!auth.currentUser)Auth.guest=true;
  onAuthStateChanged(auth,async u=>{await refreshRole(u);if(CurView==="home")renderHome();else if(CurView==="scorer"&&ScS.view==="list")scList();else if(ScS.m)scMatchView();});
  onSnapshot(collection(db,"matches"),s=>{ScMatches=s.docs.map(d=>({...d.data(),id:d.id}));if(CurView==="scorer"&&ScS.view==="list")scMatchList();});
  if(mid){setView("scorer");scOpenMatch(mid);}else{setView("home");}
}
</script>
</body>
