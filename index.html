// ===== SCORER FUNCTIONS =====
const wk = m => (m.history || []).filter(x => x.w).length;
const when = t => t ? new Date(t).toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
const tname = id => (S.tours.find(t => t.id === id) || {}).name || "";
const ovs = b => `${Math.floor(b / 6)}.${b % 6}`;
const ref = id => doc(db, "matches", id);

function info(m){
  const maxb = m.overs * 6, w = wk(m), inn = m.innings || 1;
  const first = m.bat1 === 2 ? m.n2 : m.n1, second = m.bat1 === 2 ? m.n1 : m.n2;
  const bat = inn === 1 ? first : second, bowl = inn === 1 ? second : first;
  const i1over = inn === 1 && (m.balls >= maxb || w >= 10);
  const done = inn === 2 && (m.runs > m.inn1 || m.balls >= maxb || w >= 10);
  let res = "";
  if (done) {
    if (m.runs > m.inn1) res = `${bat} won by ${10 - w} wicket${10 - w > 1 ? "s" : ""}`;
    else if (m.runs < m.inn1) res = `${bowl} won by ${m.inn1 - m.runs} run${m.inn1 - m.runs > 1 ? "s" : ""}`;
    else res = "Match tied";
  }
  return {maxb, w, inn, bat, bowl, i1over, done, res};
}

function ticker(m, ov){
  const i = info(m), ws = i.bat.trim().split(/\s+/), cls = "tk" + (ov ? " ov" : "");
  if (i.done) return `<div class="${cls}" style="justify-content:center"><i class="gb"></i><div class="res">🏆 ${esc(i.res.toUpperCase())}</div></div>`;
  const need = m.inn1 - m.runs + 1;
  const chase = ov && i.inn === 2 ? `<u></u><div class="tc"><small style="color:#ffd700">CHASE</small><div class="os" style="font-size:18px;font-weight:700;color:${need > 0 ? "#ff6b6b" : "#6fcf97"}">${Math.max(0, need)} off ${Math.max(0, i.maxb - m.balls)}</div></div>` : "";
  return `<div class="${cls}"><i class="gb"></i>
    <div class="tc tm"><b>${esc((ws[0] || "").toUpperCase())}</b><span>${esc((ws[1] || "").toUpperCase())}</span></div><u></u>
    <div class="tc"><div class="sc">${m.runs}/${i.w}</div></div><u></u>
    <div class="tc"><small>OVERS</small><div class="ov2">${ovs(m.balls)}</div></div><u></u>
    <div class="tc"><div class="mx">(${String(m.overs).padStart(2, "0")})</div></div>${chase}</div>`;
}

const bStat = (h, n) => { let r = 0, b = 0; h.forEach(x => { if (x.s === n) { r += x.br || 0; if (x.e !== "wd") b++; } }); return [r, b]; };
const wStat = (h, n) => { let r = 0, b = 0, w = 0; h.forEach(x => { if (x.o === n) { r += x.r; b += x.b; if (x.w && x.k !== "ro") w++; } }); return `${Math.floor(b / 6)}.${b % 6}-${r}-${w}`; };
function players(m){
  const c = m.cur; if (!c || (!c.s && !c.n && !c.b) || info(m).done) return "";
  const st = n => { if (!n) return ""; const [r, b] = bStat(m.history, n); return `<span>${n === c.s ? "▶ " : ""}<b>${esc(n)}</b> ${r}(${b})</span>`; };
  return `<div class="pl">${st(c.s)}${st(c.n)}${c.b ? `<span>⚾ <b>${esc(c.b)}</b> ${wStat(m.history, c.b)}</span>` : ""}</div>`;
}

function points(){
  if (!S.tour) return `<div class="mut c" style="margin:24px 0">Select a tournament above.</div>`;
  const T = {}, row = (id, n) => T[id] ??= {n, p:0, w:0, l:0, t:0, pts:0, rf:0, bf:0, ra:0, ba:0};
  const ms = S.matches.filter(m => m.tid === S.tour);
  ms.forEach(m => { row(m.t1, m.n1); row(m.t2, m.n2); });
  ms.filter(m => m.status === "completed").forEach(m => {
    const f = m.bat1 === 2 ? 2 : 1, a = row(f === 1 ? m.t1 : m.t2), b = row(f === 1 ? m.t2 : m.t1);
    a.p++; b.p++;
    if (m.runs > m.inn1) { b.w++; a.l++; b.pts += 2; } else if (m.runs < m.inn1) { a.w++; b.l++; a.pts += 2; } else { a.t++; b.t++; a.pts++; b.pts++; }
    if (m.inn1b != null) {
      const mb = m.overs * 6, ab = m.inn1w >= 10 ? mb : m.inn1b, bb = (m.history || []).filter(x => x.w).length >= 10 ? mb : m.balls;
      a.rf += m.inn1; a.bf += ab; a.ra += m.runs; a.ba += bb; b.rf += m.runs; b.bf += bb; b.ra += m.inn1; b.ba += ab;
    }
  });
  const nrr = x => x.bf && x.ba ? x.rf / (x.bf / 6) - x.ra / (x.ba / 6) : null;
  const rows = Object.values(T).sort((a, b) => b.pts - a.pts || (nrr(b) ?? -99) - (nrr(a) ?? -99));
  if (!rows.length) return `<div class="mut c" style="margin:24px 0">No teams in this tournament yet.</div>`;
  return `<table class="pt"><tr><th>TEAM</th><th>P</th><th>W</th><th>L</th><th>T</th><th>NRR</th><th>PTS</th></tr>${rows.map(x => `<tr><td>${esc(x.n)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${nrr(x) == null ? "–" : (nrr(x) > 0 ? "+" : "") + nrr(x).toFixed(3)}</td><td><b>${x.pts}</b></td></tr>`).join("")}</table><div class="mut c" style="margin-top:8px">Win = 2 pts · Tie = 1 pt</div>`;
}

  const mt = S.mt || (G.l.length ? "l" : "u");
  const card = m => {
    const i = info({...m, history:m.history || []});
    const line = m.status === "scheduled" ? "" : `<div class="os gold" style="font-size:17px">${i.done ? "🏆 " + esc(i.res) : `${esc(i.bat)} ${m.runs}/${i.w} (${ovs(m.balls)})`}</div>`;

function inn(h, cur){
  const order = [], seen = new Set(), add = n => { if (n && !seen.has(n)) { seen.add(n); order.push(n); } };
  h.forEach(x => { if (x.p) { add(x.p[0]); add(x.p[1]); } });
  if (cur) { add(cur.s); add(cur.n); }
  const outs = new Set(h.filter(x => x.w).map(x => x.d || x.s)), bw = [];
  const how = n => {
    if (cur && (cur.s === n || cur.n === n)) return "";
    const x = [...h].reverse().find(y => (y.d || y.s) === n && (y.w || y.k === "rth")); if (!x) return "";
    const o = x.o || "", f = x.f;
    return ({b:`b ${o}`, c:f ? (f === o ? `c & b ${o}` : `c ${f} b ${o}`) : `caught b ${o}`, lbw:`lbw b ${o}`, st:`st ${f || ""} b ${o}`, hw:`hit wicket b ${o}`, ro:`run out${f ? ` (${f})` : ""}`, rtd:"retired out", rth:"retired hurt"})[x.k] || "out";
  };
  h.forEach(x => { if (x.o && !bw.includes(x.o)) bw.push(x.o); });
  return {bats:order.map(n => { const [r, b] = bStat(h, n); return {n, r, b, out:outs.has(n), how:how(n)}; }), bows:bw.map(n => ({n, f:wStat(h, n)})),
    wd:h.filter(x => x.e === "wd").reduce((a, x) => a + x.r, 0), nb:h.filter(x => x.e === "nb").length};
}
function summary(m){
  const i = info(m), first = m.bat1 === 2 ? m.n2 : m.n1, second = m.bat1 === 2 ? m.n1 : m.n2;
  const blk = (team, runs, w, balls, h, cur) => {
    const d = inn(h, cur);
    return `<div class="sm1"><div class="row"><b class="os">${esc(team)}</b><b class="os gold">${runs}/${w} <span class="mut">(${ovs(balls)} ov)</span></b></div>
      ${d.bats.length ? `<table class="pt">${d.bats.map(x => `<tr><td>${esc(x.n)}<br><span class="mut" style="font-size:12px">${esc(x.how || "not out")}</span></td><td><b>${x.r}</b></td><td class="mut">${x.b}b</td></tr>`).join("")}</table>` : ""}
      ${d.bows.length ? `<div class="mut" style="margin-top:6px">Bowling (O-R-W)</div><table class="pt">${d.bows.map(x => `<tr><td>${esc(x.n)}</td><td>${x.f}</td></tr>`).join("")}</table>` : ""}
      <div class="mut" style="margin-top:6px">Extras: wides ${d.wd}, no-balls ${d.nb}</div></div>`;
  };
  return (i.done ? `<div class="res">🏆 ${esc(i.res.toUpperCase())}</div>` : "") +
    (m.innings === 2 ? blk(first, m.inn1, m.inn1w ?? 0, m.inn1b ?? 0, m.hist1 || [], null) + blk(second, m.runs, i.w, m.balls, m.history, m.cur) : blk(first, m.runs, i.w, m.balls, m.history, m.cur));
}
function summaryText(m, link){
  const i = info(m), first = m.bat1 === 2 ? m.n2 : m.n1, second = m.bat1 === 2 ? m.n1 : m.n2;
  const L = [`🏏 ${m.n1} vs ${m.n2} — ${tname(m.tid)}`];
  if (m.innings === 2) L.push(`${first}: ${m.inn1}/${m.inn1w ?? 0} (${ovs(m.inn1b ?? 0)})`, `${second}: ${m.runs}/${i.w} (${ovs(m.balls)})`);
  else L.push(`${first}: ${m.runs}/${i.w} (${ovs(m.balls)})`);
  L.push(i.done ? `🏆 ${i.res}` : "⏳ In progress");
  const top = [...inn(m.hist1 || [], null).bats, ...inn(m.history, null).bats].sort((a, b) => b.r - a.r)[0];
  if (top && top.r > 0) L.push(`⭐ Top score: ${top.n} ${top.r}(${top.b})`);
  return L.join("\n") + "\n" + link;
}

function downloadSummaryImage(m){
  const i = info(m), first = m.bat1 === 2 ? m.n2 : m.n1, second = m.bat1 === 2 ? m.n1 : m.n2;
  const topBats = (bats, n = 3) => bats.sort((a, b) => b.r - a.r).slice(0, n);
  const topBows = (bows, n = 3) => {
    const parsed = bows.map(x => {
      const parts = x.f.split("-");
      return {n: x.n, w: +parts[0], r: +parts[1], o: parts[2]};
    }).sort((a, b) => b.w - a.w || (a.r / a.o) - (b.r / b.o));
    return parsed.slice(0, n);
  };
  const inn1 = inn(m.hist1 || [], null);
  const inn2 = inn(m.history, m.cur);
  const renderTeam = (name, runs, w, balls, d) => {
    const tb = topBats(d.bats, 3);
    const bw = topBows(d.bows, 3);
    return `<div class="sum-team">
      <h2>${esc(name)}</h2>
      <div class="score">${runs}/${w} (${ovs(balls)} ov)</div>
      <table class="sum-table">
        <tr><th colspan="3">TOP BATSMEN</th></tr>
        ${tb.map((x, idx) => `<tr><td class="pos">${idx + 1}</td><td>${esc(x.n)}${x.out ? "" : "*"}</td><td class="runs">${x.r} (${x.b})</td></tr>`).join("")}
        <tr><th colspan="3">TOP BOWLERS</th></tr>
        ${bw.map((x, idx) => `<tr><td class="pos">${idx + 1}</td><td>${esc(x.n)}</td><td class="runs">${x.w}-${x.r} (${x.o})</td></tr>`).join("")}
      </table>
    </div>`;
  };
  const html = `<div class="sum-hdr">
    <h1>🏏 MATCH SUMMARY</h1>
    <p>${esc(m.n1)} vs ${esc(m.n2)} · ${esc(tname(m.tid))} · ${when(m.when) || "—"}</p>
  </div>
  <div class="sum-body">
    ${m.innings === 2 ? renderTeam(first, m.inn1, m.inn1w ?? 0, m.inn1b ?? 0, inn1) + renderTeam(second, m.runs, i.w, m.balls, inn2) : renderTeam(first, m.runs, i.w, m.balls, inn2)}
  </div>
  ${i.done ? `<div class="sum-team" style="grid-column:1/-1;text-align:center;background:rgba(195,164,105,.15)"><h2 style="color:#ffd700">🏆 ${esc(i.res.toUpperCase())}</h2></div>` : ""}
  <div class="sum-ftr">Created by Amanullah Khan | www.smartstudygrid.com</div>`;
  $("#sumImg").innerHTML = html;
  const html2canvas = window.html2canvas;
  if (html2canvas) {
    html2canvas($("#sumImg"), {backgroundColor: "#1a1a2e", scale: 2}).then(canvas => {
      const link = document.createElement("a");
      link.download = `match-summary-${m.id}.png`;
      link.href = canvas.toDataURL();
      link.click();
      $("#sumImg").innerHTML = "";
    });
  } else {
    flash("html2canvas library not loaded. Please check your internet connection.");
  }
}

const ball = (kind, v, w) => act(() => {
  const m = S.m, c = m.cur, legal = kind ? 0 : 1, r = kind ? v + 1 : v;
  const e = {r, b:legal, w:w ? 1 : 0, e:kind, br:kind === "wd" ? 0 : v};
  const u = {runs:m.runs + r, balls:m.balls + legal};
  if (c) {
    Object.assign(e, {s:c.s ?? null, o:c.b ?? null, p:[c.s ?? null, c.n ?? null, c.b ?? null, c.lb ?? null]});
    let s = c.s, n = c.n, b = c.b, lb = c.lb ?? null;
    if (v % 2) [s, n] = [n, s];
    if (w) s = null;
    if (legal && u.balls % 6 === 0) { [s, n] = [n, s]; lb = b; b = null; }
    u.cur = {s:s ?? null, n:n ?? null, b:b ?? null, lb};
  }
  u.history = [...m.history, e];
  return updateDoc(ref(m.id), u);
});
const undo = () => act(() => {
  const h = [...S.m.history], l = h.pop(); if (!l) return;
  const u = {runs:Math.max(0, S.m.runs - l.r), balls:Math.max(0, S.m.balls - l.b), history:h, status:"live"};
  if (l.p) u.cur = {s:l.p[0], n:l.p[1], b:l.p[2], lb:l.p[3]};
  return updateDoc(ref(S.m.id), u);
});
const wicket = (k, d, v = 0, f = null) => act(() => {
  const m = S.m, c = m.cur;
  const e = {r:v, b:1, w:1, e:"", br:v, s:c.s ?? null, o:c.b ?? null, d, k, f, p:[c.s ?? null, c.n ?? null, c.b ?? null, c.lb ?? null]};
  const u = {runs:m.runs + v, balls:m.balls + 1};
  let s = c.s, n = c.n, b = c.b, lb = c.lb ?? null;
  if (v % 2) [s, n] = [n, s];
  if (s === d) s = null; else if (n === d) n = null;
  if (u.balls % 6 === 0) { [s, n] = [n, s]; lb = b; b = null; }
  u.cur = {s:s ?? null, n:n ?? null, b:b ?? null, lb};
  u.history = [...m.history, e];
  return updateDoc(ref(m.id), u);
});
const retire = (k, d) => act(() => {
  const m = S.m, c = m.cur; let s = c.s, n = c.n;
  if (s === d) s = null; else n = null;
  const e = {r:0, b:0, w:k === "rtd" ? 1 : 0, e:"ret", br:0, s:null, o:null, d, k, f:null, p:[c.s ?? null, c.n ?? null, c.b ?? null, c.lb ?? null]};
  return updateDoc(ref(m.id), {cur:{s:s ?? null, n:n ?? null, b:c.b ?? null, lb:c.lb ?? null}, history:[...m.history, e]});
});
const squadPick = (m, k) => {
  const pl = m["pl" + k], sel = S.sel[k], need = Math.min(11, pl.length), rest = pl.filter(p => !sel.includes(p));
  return `<div class="xm"><h3>${esc(m["n" + k])} — PLAYING XI (${sel.length}/${need})</h3>
    <div class="chips">${pl.map(p => `<button class="chip ${sel.includes(p) ? "on" : ""}" data-k="${k}" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <label>12th player</label><select data-sub="${k}"><option value="">— none —</option>${rest.map(p => `<option ${S.sub[k] === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>`;
};
const sel = (id, arr) => `<select id="${id}">${arr.map(p => `<option>${esc(p)}</option>`).join("")}</select>`;

function matchView(){
  const m = S.m, i = info(m), A = canScore(m), base = location.origin + location.pathname;
  const view = base + "?match=" + m.id, ov = base + "?mode=overlay&match=" + m.id;
  const P = !!(m.pl1 && m.pl1.length), fi = m.bat1 === 2 ? 2 : 1, kb = i.inn === 1 ? fi : 3 - fi;
  const xiB = m["xi" + kb] || [], xiW = m["xi" + (3 - kb)] || [], c = m.cur;
  const outs = new Set(m.history.filter(x => x.w).map(x => x.d || x.s));
  if (A && m.status === "live" && i.done) act(() => updateDoc(ref(m.id), {status:"completed"}));
  const stage = A && m.status === "live" && m.xi1 && !i.done && !i.i1over ? (!c ? "open" : (!c.s || !c.n) ? "bat" : !c.b ? "bowl" : "") : "";
  const fl = [...xiW, ...(m["s" + (3 - kb)] ? [m["s" + (3 - kb)]] : [])], cb2 = c ? [c.s, c.n].filter(Boolean) : [];
  const fsel = `<label>Fielder (optional)</label><select id="fl"><option value="">—</option>${fl.map(p => `<option>${esc(p)}</option>`).join("")}</select>`;
  const KINDS = [["b","Bowled"],["c","Caught"],["lbw","LBW"],["ro","Run Out"],["st","Stumped"],["hw","Hit Wicket"],["rtd","Retired Out"],["rth","Retired Hurt"]];
  const outUI = () => S.out === "menu"
    ? `<div class="xm"><h3>HOW OUT?</h3><div class="xg" style="grid-template-columns:repeat(2,1fr)">${KINDS.map(([k, t]) => `<button class="sb" style="font-size:17px" data-ok="${k}">${t}</button>`).join("")}</div><button class="btn s" id="oc">Cancel</button></div>`
    : `<div class="xm"><h3>${KINDS.find(x => x[0] === S.out)[1].toUpperCase()}</h3>${["ro","rtd","rth"].includes(S.out) ? `<label>${S.out === "ro" ? "Batter out" : "Batter"}</label>${sel("od", cb2)}`: ""}${S.out === "ro" ?`<label>Runs completed</label><select id="orr">${[0,1,2,3].map(v => `<option>${v}</option>`).join("")}</select>` : ""}${["c","st","ro"].includes(S.out) ? fsel : ""}<button class="btn" id="ocf">Confirm</button><button class="btn s" id="oc">Cancel</button></div>`;
  const cbUI = () => `<div class="xm"><h3>CHANGE BATTER</h3><label>Replace</label>${sel("cr", cb2)}<label>With</label>${sel("cw", xiB.filter(p => !outs.has(p) && p !== c.s && p !== c.n))}<button class="btn" id="cbc">Confirm</button><button class="btn s" id="cbx">Cancel</button></div>`;
  let h = `<div class="top"><button class="btn s sm" id="bk">← Matches</button><a class="btn s sm" target="_blank" href="https://wa.me/?text=${encodeURIComponent(view)}">📲 Share</a></div>
    <div class="mut c" style="margin-bottom:6px">${esc(tname(m.tid))} · ${m.overs} overs${m.when ? " · " + when(m.when) : ""}</div>`;
  if (m.status === "scheduled") {
    h += `<div class="card" style="cursor:default"><div class="vs c"><b>${esc(m.n1)}</b> vs <b>${esc(m.n2)}</b></div><div class="mut c">${esc(m.venue || "")}</div></div>`;
    if (A) h += `<label>Who bats first?</label><select id="bf"><option value="1">${esc(m.n1)}</option><option value="2">${esc(m.n2)}</option></select>${P ? squadPick(m, 1) + squadPick(m, 2) : ""}<button class="btn" id="st">Start Match</button>`;
    else h += `<div class="tg">Match not started yet</div>`;
  } else {
    h += ticker(m) + players(m);
    if (m.innings === 2 && !i.done) { const need = m.inn1 - m.runs + 1; h += `<div class="tg">${need > 0 ? `🎯 Need ${need} runs in ${ovs(i.maxb - m.balls)} overs` : "✅ Target achieved!"}</div>`; }
    if (i.i1over) {
      h += `<div class="card" style="cursor:default;text-align:center"><div class="os gold" style="font-size:24px">Innings Over</div><div class="os" style="font-size:44px">${m.runs}/${i.w}</div><div class="mut">${esc(i.bat)} — 1st innings</div><div>${esc(i.bowl)} to chase</div></div>`;
      if (A) h += `<button class="btn" id="s2">Start 2nd Innings</button><button class="btn s" id="un">↩ Undo last ball</button>`;
    } else if (stage === "open") {
      h += `<div class="xm"><h3>OPENING PLAYERS</h3><label>Striker</label>${sel("ps", xiB)}<label>Non-striker</label>${sel("pn", xiB)}<label>Opening bowler</label>${sel("pb", xiW)}<button class="btn" id="cf">Confirm</button></div>`;
    } else if (stage === "bat") {
      const av = xiB.filter(p => !outs.has(p) && p !== c.s && p !== c.n);
      h += `<div class="xm"><h3>NEW BATTER</h3>${sel("pa", av)}<button class="btn" id="cf">Confirm</button></div><button class="btn s" id="un">↩ Undo last ball</button>`;
    } else if (stage === "bowl") {
      h += `<div class="xm"><h3>BOWLER FOR OVER ${Math.floor(m.balls / 6) + 1}</h3>${sel("pb2", xiW.filter(p => p !== c.lb))}<button class="btn" id="cf">Confirm</button></div><button class="btn s" id="sw">⇄ Switch Strike</button><button class="btn s" id="un">↩ Undo last ball</button>`;
    } else if (A && !i.done) {
      h += S.out ? outUI() : S.cb ? cbUI() : S.ex
        ? `<div class="xm"><h3>WIDE BALLS</h3><div class="xg" style="grid-template-columns:repeat(5,1fr)">${[0,1,2,3,4].map(v => `<button class="sb" data-xk="wd" data-xv="${v}">W+${v}</button>`).join("")}</div>
           <h3>NO BALLS</h3><div class="xg" style="grid-template-columns:repeat(6,1fr)">${[0,1,2,3,4,6].map(v => `<button class="sb" data-xk="nb" data-xv="${v}">N+${v}</button>`).join("")}</div><button class="btn s" id="xc">Cancel</button></div>`
        : `<div class="g4">${[0,1,2,3].map(v => `<button class="sb" data-r="${v}">${v}</button>`).join("")}</div>
           <div class="g4"><button class="sb f" data-r="4">4</button><button class="sb s6" data-r="6">6</button><button class="sb o" id="out">OUT</button><button class="sb u" id="un">UNDO</button></div>
           <button class="btn" id="ex">ADD EXTRAS</button>${c ? `<div class="g2"><button class="btn s" id="sw">⇄ Switch Strike</button><button class="btn s" id="cb">✎ Change Batter</button></div>` : ""}`;
    } else if (A && i.done) h += `<button class="btn s" id="un">↩ Undo last ball</button>`;
    if (!i.done) h += `<div class="mut c">Live — updates automatically</div>`;
    h += `<details id="sd" class="mut" style="margin-top:12px" ${(S.sumOpen ?? (m.status === "completed" || S.sumParam)) ? "open" : ""}><summary>📊 Match Summary</summary><div style="margin-top:8px">${summary(m)}<div style="display:flex;gap:8px;margin-top:8px"><a class="btn s sm" target="_blank" href="https://wa.me/?text=${encodeURIComponent(summaryText(m, view + "&summary=1"))}">📲 Share Summary</a><button class="btn s sm" id="dls">📥 Download Image</button></div></div></details>`;
    if (m.xi1) h += `<details class="mut" style="margin-top:10px"><summary>Playing XIs &amp; 12th players</summary>${[1,2].map(k => `<div style="margin-top:6px"><b>${esc(m["n" + k])}</b>: ${esc((m["xi" + k] || []).join(", "))}<br>12th: ${esc(m["s" + k] || "–")}</div>`).join("")}</details>`;
  }
  if (A) h += `<button class="btn s" id="cp" style="margin-top:14px">📋 Copy Overlay Link</button>${m.status === "completed" ? `<div class="msg err" style="margin-top:8px">⚠️ Match completed - only admin can edit or delete</div>` : ""}<div class="mut c" style="word-break:break-all;font-size:11px">${esc(ov)}</div>`;
  const y = scrollY;
  $("#content").innerHTML = h + `<div id="msg" class="msg"></div>`;
  scrollTo(0, y);
  if (A && m.status === "live") lock();
  if ($("#pn")) $("#pn").selectedIndex = Math.min(1, $("#pn").options.length - 1);
  $("#bk").onclick = list;
  if ($("#sd")) $("#sd").ontoggle = () => { S.sumOpen = $("#sd").open; };
  const on = (s, fn) => { const e = $(s); if (e) e.onclick = fn; };
  on("#st", () => {
    const u = {status:"live", bat1:+$("#bf").value, innings:1, runs:0, balls:0, history:[], cur:null};
    if (P) {
      for (const k of [1, 2]) {
        const required = Math.min(11, m["pl" + k].length);
        if (S.sel[k].length !== required) return flash(`Select ${required} players for ${m["n" + k]}.`);
        u["xi" + k] = S.sel[k];
        u["s" + k] = S.sub[k] || "";
      }
    }
    act(async () => {
      await updateDoc(ref(m.id), u);
      flash("Match started!", true);
    });
  });
  on("#s2", () => act(() => updateDoc(ref(m.id), {innings:2, inn1:m.runs, inn1w:i.w, inn1b:m.balls, hist1:m.history, runs:0, balls:0, history:[], cur:null})));
  on("#cf", () => {
    if (stage === "open") { const s = $("#ps").value, n = $("#pn").value; if (s === n) return flash("Striker and non-striker must be different."); act(() => updateDoc(ref(m.id), {cur:{s, n, b:$("#pb").value, lb:null}})); }
    else if (stage === "bat") { const p = $("#pa").value; if (p) act(() => updateDoc(ref(m.id), {cur:{...c, [c.s ? "n" : "s"]:p}})); }
    else act(() => updateDoc(ref(m.id), {cur:{...c, b:$("#pb2").value}}));
  });

const abbr = n => { const w = n.trim().split(/\s+/); return (w.length > 1 ? w.map(x => x[0]).join("") : n.slice(0, 3)).toUpperCase().padEnd(3, "X").slice(0, 3); };
function bar(m){
  const i = info(m), h = m.history, c = m.cur || {};
  if (m.status === "scheduled" || i.done) {
    const txt = i.done ? `🏆 ${esc(i.res)}` : `${esc(m.n1)} v ${esc(m.n2)}`;
    const sub = i.done ? `${esc(m.bat1 === 2 ? m.n2 : m.n1)} ${m.inn1}/${m.inn1w ?? 0} · ${esc(i.bat)} ${m.runs}/${i.w}` : esc(when(m.when));
    return `<div class="ob" style="height:5rem"><div class="ob1"><div class="lp"><div class="tm"><b style="font:700 3.4rem/1 Oswald">${esc(abbr(m.n1))}</b></div></div><div class="bn"><b>${txt}</b><span>${sub}</span></div><div class="rp"><div class="tm"><b style="font:700 3.4rem/1 Oswald;color:#fff">${esc(abbr(m.n2))}</b></div></div></div></div>`;
  }
  const fig = n => { let r = 0, b = 0, w = 0; h.forEach(x => { if (x.o === n) { r += x.r; b += x.b; if (x.w && x.k !== "ro") w++; } }); return `${w}-${r}<small>(${Math.floor(b / 6)}.${b % 6})</small>`; };
  let ov = [], lc = 0, full = false;
  h.forEach(x => { if (x.e === "ret") return; if (full) { ov = []; full = false; } ov.push(x); if (x.b && ++lc % 6 === 0) full = true; });
  const cc = x => x.w ? `<i class="cw">W</i>` : x.e === "wd" ? `<i class="cx">Wd${x.r > 1 ? x.r - 1 : ""}</i>` : x.e === "nb" ? `<i class="cx">Nb${x.r > 1 ? x.r - 1 : ""}</i>` : x.r === 4 || x.r >= 6 ? `<i class="cg">${x.r}</i>` : x.r === 0 ? `<i class="c0">•</i>` : `<i>${x.r}</i>`;
  const circ = ov.map(cc); while (circ.length < 6) circ.push(`<i class="e"></i>`);
  const first = []; h.forEach(x => { if (x.p) x.p.slice(0, 2).forEach(n => n && !first.includes(n) && first.push(n)); });
  const idx = n => first.includes(n) ? first.indexOf(n) : 99;
  const bs = [c.s, c.n].filter(Boolean).sort((a, b) => idx(a) - idx(b));
  const kb = i.inn === 1 ? (m.bat1 === 2 ? 2 : 1) : (m.bat1 === 2 ? 1 : 2);
  const pic = n => { const p = (S.pics[kb] || {})[n]; return p ? `<span class="ph"><img src="data:image/jpeg;base64,${p}"></span>` : ""; };
  const bt = n => { const [r, b] = bStat(h, n); return `<div class="bt"><span class="nm"><u class="${n === c.s ? "on" : ""}"></u>${esc(n)}</span>${pic(n)}<span class="rn">${r}<small>(${b})</small></span></div>`; };
  const crr = m.balls ? (m.runs / (m.balls / 6)).toFixed(2) : "0.00";
  const left = i.maxb - m.balls;
  let mid = "";
  if (i.inn === 1) {
    const proj = crr > 0 ? Math.round((crr * m.overs)).toFixed(0) : m.runs;
    mid = `CRR ${crr} · PROJ ${proj}`;
  } else {
    const need = m.inn1 - m.runs + 1;
    const rrr = left > 0 && need > 0 ? (need / (left / 6)).toFixed(2) : "0.00";
    const needTxt = need > 0 ? `NEED ${need} OFF ${left}` : "TARGET ACHIEVED";
    mid = `CRR ${crr} · RRR ${rrr} · <span style="color:#ffd700">TGT ${m.inn1 + 1}</span> · ${needTxt}`;
  }
  return `<div class="ob"><div class="ob1">
    <div class="lp"><div class="tm"><b style="font:700 3.4rem/1 Oswald">${esc(abbr(i.bat))}</b></div></div>
    <div class="sc">${m.runs}-${i.w}</div>
    <div class="ovs"><small>OVERS</small><b>${ovs(m.balls)}</b><i>(${m.overs})</i></div>
    ${[0, 1].map(k => bs[k] ? bt(bs[k]) : `<div class="bt"></div>`).join("")}
    <div class="rp"><div class="tm"><b style="font:700 3.4rem/1 Oswald;color:#fff">${esc(abbr(i.bowl))}</b></div></div></div>
    <div class="ob2"><div class="to">THIS<br>OVER</div><div class="cs">${circ.join("")}</div>
      <div class="mid">${mid}</div>
      <div class="bw">${esc((c.b || "–").toUpperCase())}${c.b ? `<em>${fig(c.b)}</em>` : ""}</div></div></div>`;
}
async function loadPics(m){
  if (S.picsFor === m.id) return; S.picsFor = m.id; S.pics = {1:{}, 2:{}};
  for (const k of [1, 2]) {
    if (!m["t" + k]) continue;
    try {
      const d = (await getDoc(doc(db, "squads", m["t" + k]))).data() || {};
      (d.player_list || []).forEach((n, i) => { const p = (d.squad_pics || {})[i]; if (n && p) S.pics[k][n] = p; });
      if (d.captain_name && d.cap_pic) S.pics[k][d.captain_name] = d.cap_pic;
    } catch {}
  }
}
function overlay(id){
  document.documentElement.classList.add("ovh"); document.body.classList.add("ovb");
  let last = null; const draw = () => { $("#content").innerHTML = last ? bar(last) : ""; };
  onSnapshot(ref(id), s => {
    if (!s.exists()) { last = null; return draw(); }
    last = {...s.data(), id:s.id, history:s.data().history || []}; draw();
    if (S.picsFor !== s.id) loadPics(last).then(draw);
  });
}

          $("#cu").dataset.edit = b.dataset.es;
        }
      });
    } catch (e) { $("#ul").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  loadUsers();
  document.querySelectorAll("#tchips .chip").forEach(chip => {
    chip.onclick = () => chip.classList.toggle("on");
  });
  $("#cu").onclick = async () => {
    const em = $("#ue").value.trim(), pw = $("#up").value, editId = $("#cu").dataset.edit;
    const selectedTeams = [...document.querySelectorAll("#tchips .chip.on")].map(c => c.dataset.tid);
    if (!em.includes("@")) return flash("Enter a valid email.");
    if (selectedTeams.length === 0) return flash("Select at least one team.");
    if (pw && pw.length < 6) return flash("Password must be at least 6 characters.");
    try {
      if (editId) {
        // Update existing scorer
        await setDoc(doc(db, "scorers", editId), {tids:selectedTeams}, {merge:true});
        if (pw) {
          const a2 = getAuth(getApps().find(a => a.name === "sec") || initializeApp(cfg, "sec"));
          await signInWithEmailAndPassword(a2, em, pw);
          await updatePassword(a2.currentUser, pw);
          await signOut(a2);
        }
        flash("Scorer updated successfully!", "ok");
        $("#cu").textContent = "Add Scorer";
        delete $("#cu").dataset.edit;
        $("#ue").value = ""; $("#up").value = "";
        document.querySelectorAll("#tchips .chip").forEach(c => c.classList.remove("on"));
      } else {
        // Create new scorer
        if (pw) {
          const a2 = getAuth(getApps().find(a => a.name === "sec") || initializeApp(cfg, "sec"));
          await createUserWithEmailAndPassword(a2, em, pw);
          await signOut(a2);
        }
        await setDoc(doc(db, "scorers", em), {email:em, tids:selectedTeams, created_at:Date.now(), created_by:auth.currentUser.email}, {merge:true});
        $("#ue").value = ""; $("#up").value = "";
        document.querySelectorAll("#tchips .chip").forEach(c => c.classList.remove("on"));
        flash("Scorer created successfully!", "ok");
      }
      loadUsers();
    } catch (e) {
      if (e.code === "auth/email-already-in-use") {
        await setDoc(doc(db, "scorers", em), {email:em, tids:selectedTeams, created_at:Date.now(), created_by:auth.currentUser.email}, {merge:true});
        flash("Scorer already exists - teams updated.", "ok");
        loadUsers();
      } else {
        flash(e.message, "err");
      }
    }
  };
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const t = S.teams[+b.dataset.i], a = b.dataset.act;
    if (a === "pw") {
      const p = document.querySelector(`[data-pw="${b.dataset.i}"]`).value;
      if (p.length < 4) return flash("Password must be at least 4 characters.", "err");
      run(async () => setDoc(doc(db, COL, t.id), {pw_hash:await sha(p)}, {merge:true}), `Password updated for ${t.name}.`);
    } else if (a === "lock") run(() => setDoc(doc(db, COL, t.id), {is_locked:!t.locked}, {merge:true}), `${t.name} ${t.locked ? "unlocked" : "locked"}.`);
    else if (a === "view") openSquad(t.id, true);
    else if (confirm(`Delete "${t.name}" and its whole squad?`)) run(() => deleteDoc(doc(db, COL, t.id)), `${t.name} deleted.`);
  });
}

function crop(file, ratio, circle){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.onload = () => {
      const W = 300, H = Math.round(W / ratio);
      const ov = document.createElement("div"); ov.className = "modal";
      ov.innerHTML = `<div class="mb"><div class="mt">Frame face + shoulders</div>
        <canvas width="${W}" height="${H}" class="cv ${circle ? "rc" : ""}"></canvas>
        <input type="range" id="z" min="1" max="6" step="0.01" value="1">
        <div class="hint">Drag to move · slider or scroll to zoom</div>
        <div style="display:flex;gap:10px"><button class="btn sec auto" id="cx">Cancel</button><button class="btn auto" id="ck">Use photo</button></div></div>`;
      document.body.append(ov);
      const c = ov.querySelector("canvas"), g = c.getContext("2d"), zs = ov.querySelector("#z");
      const base = Math.max(W / im.width, H / im.height);
      let z = 1, x = 0, y = 0, drag = null;
      const draw = () => {
        const s = base * z, mx = (im.width * s - W) / 2, my = (im.height * s - H) / 2;
        x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y));
        g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
        g.drawImage(im, W / 2 + x - im.width * s / 2, H / 2 + y - im.height * s / 2, im.width * s, im.height * s);
      };
      const done = v => { URL.revokeObjectURL(url); ov.remove(); res(v); };
      zs.oninput = () => { z = +zs.value; draw(); };
      c.onwheel = e => { e.preventDefault(); z = Math.min(6, Math.max(1, z - e.deltaY * .003)); zs.value = z; draw(); };
      c.onpointerdown = e => { drag = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); };
      c.onpointermove = e => {
        if (!drag) return;
        const k = W / c.getBoundingClientRect().width;
        x += (e.clientX - drag[0]) * k; y += (e.clientY - drag[1]) * k; drag = [e.clientX, e.clientY]; draw();
      };
      c.onpointerup = () => drag = null;
      ov.querySelector("#cx").onclick = () => done(null);
      ov.querySelector("#ck").onclick = () => done(c.toDataURL("image/jpeg", .72).split(",")[1]);
      draw();
    };
    im.src = url;
  });
}

async function openSquad(team, viewOnly){
  $("#content").innerHTML = `<div class="wrap"><div class="msg">Loading…</div></div>`;
  try {
    const snap = await getDoc(doc(db, COL, team));
    const x = snap.exists() ? snap.data() : {};
    S.d = {
      is_locked: !!x.is_locked,
      names: Array.from({length:17}, (_, i) => (x.player_list || [])[i] || ""),
      pics: x.squad_pics || {},
      cap_name: x.captain_name || "",
      cap_pic: x.cap_pic || null,
      logo: x.team_logo || null
    };
  } catch (e) {
    $("#content").innerHTML = `<div class="wrap"><div class="login"><div class="msg err">Connection error: ${esc(e.message)}</div><button class="btn sec" id="b">Back</button></div></div>`;
    $("#b").onclick = squadHome; return;
  }
  const tm = S.teams.find(x => x.id === team);
  const isOwnTeam = S.teamIds && S.teamIds.includes(team);
  Object.assign(S, {page:"squad", team, tname:tm ? tm.name : team, tour:(S.tours.find(x => tm && x.id === tm.tid) || S.tours[0]).name, viewOnly: viewOnly && !isOwnTeam, edit:isOwnTeam, squadMsg:""});
  squad();
}

async function downloadImg(){
  const d = S.d, W = 1600, H = 1010, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  try { await Promise.all([document.fonts.load("700 40px Oswald"), document.fonts.load("700 20px Rajdhani")]); } catch {}
  const load = b => b ? new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = "data:image/jpeg;base64," + b; }) : null;
  const [logo, cap, ...pl] = await Promise.all([load(d.logo), load(d.cap_pic), ...Array.from({length:17}, (_, i) => load(d.pics[i]))]);
  const GOLD = "#f5d073";
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#020818"); bg.addColorStop(.55, "#061535"); bg.addColorStop(1, "#03100d");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  const cover = (im, x, y, w, h) => { const k = Math.max(w / im.width, h / im.height), sw = w / k, sh = h / k; g.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, w, h); };
  const fit = (t, wt, fam, size, max) => { while (size > 10) { g.font = `${wt} ${size}px ${fam}`; if (g.measureText(t).width <= max) break; size -= 2; } };
  const ghost = (cx, cy, r, col) => { g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy - r * .5, r * .5, 0, 7); g.stroke(); g.beginPath(); g.arc(cx, cy + r * 1.2, r * .95, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); };
  const card = (x, y, w, top, imgH, barH, im, name, num, o) => {
    const h = top + imgH + barH;
    g.save(); g.shadowColor = o.glow; g.shadowBlur = 20; g.fillStyle = o.fill; rr(x, y, w, h, 10); g.fill(); g.restore();
    g.save(); rr(x, y, w, h, 10); g.clip();
    g.fillStyle = "#050f1e"; g.fillRect(x, y + top, w, imgH);
    if (im) cover(im, x, y + top, w, imgH); else ghost(x + w / 2, y + top + imgH / 2, w * .16, o.ghost);
    g.fillStyle = "rgba(0,10,30,.95)"; g.fillRect(x, y + top + imgH, w, barH);
    if (top) { g.fillStyle = "rgba(0,30,10,.95)"; g.fillRect(x, y, w, top); g.fillStyle = "#c8a84b"; g.font = "400 16px Oswald"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("★  CAPTAIN  ★", x + w / 2, y + top / 2); }
    g.restore();
    g.strokeStyle = o.border; g.lineWidth = o.bw; rr(x, y, w, h, 10); g.stroke();
    g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillStyle = "rgba(200,168,75,.95)"; g.font = "700 16px Oswald"; g.fillText(num, x + 10, y + top + 24);
    g.textAlign = "center"; g.textBaseline = "middle";
    const t = (name || "Player").toUpperCase();
    g.fillStyle = name ? o.col : "rgba(100,150,255,.45)"; fit(t, 700, o.fam, o.size, w - 20);
    g.fillText(t, x + w / 2, y + top + imgH + barH / 2 + 1);
  };
  g.save(); g.beginPath(); g.arc(120, 110, 60, 0, 7); g.clip(); g.fillStyle = "#0a1a3a"; g.fillRect(60, 50, 120, 120); if (logo) cover(logo, 60, 50, 120, 120); g.restore();
  g.strokeStyle = "rgba(200,168,75,.8)"; g.lineWidth = 3; g.beginPath(); g.arc(120, 110, 60, 0, 7); g.stroke();
  g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillStyle = "#7ab3ff"; g.font = "600 20px Oswald"; g.fillText(`◆ ${S.tour.toUpperCase()} · SEASON 18 2026 ◆`, 210, 80);
  g.fillStyle = GOLD; const tn = S.tname.toUpperCase(); fit(tn, 700, "Oswald", 76, 1300); g.fillText(tn, 210, 160);
  const ln = g.createLinearGradient(60, 0, 1540, 0); ln.addColorStop(0, "rgba(200,168,75,0)"); ln.addColorStop(.5, "rgba(200,168,75,.9)"); ln.addColorStop(1, "rgba(200,168,75,0)");
  g.fillStyle = ln; g.fillRect(60, 205, 1480, 2);
  const po = {glow:"#1a6fff", fill:"#0a1628", border:"rgba(100,180,255,.6)", bw:2, ghost:"rgba(64,96,160,.5)", col:"#fff", fam:"Rajdhani", size:22};
  for (let i = 0; i < 17; i++) card(60 + (i % 6) * 186, 240 + Math.floor(i / 6) * 226, 170, 0, 170, 40, pl[i], d.names[i], i + 1, po);
  card(1200, 240, 340, 36, 317, 58, cap, d.cap_name || "Captain", 18, {glow:"#c8a84b", fill:"#0e1a08", border:"#c8a84b", bw:3, ghost:"rgba(200,168,75,.4)", col:GOLD, fam:"Oswald", size:30});
  g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillStyle = "rgba(255,255,255,.75)"; g.font = "600 18px Rajdhani";
  g.fillText("www.smartstudygrid.com  |  Created by Amanullah Khan  |  +966568959394", W / 2, H - 30);
  c.toBlob(b => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = (S.tname.replace(/[^\w-]+/g, "_") || "squad") + "_squad.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, "image/png");
}

function squad(){
  document.body.classList.add("sq");
  const d = S.d, isOwnTeam = S.teamIds && S.teamIds.includes(S.team);
  if (isOwnTeam && !S.viewOnly) S.edit = true;
  const edit = (S.edit || isOwnTeam) && !S.viewOnly && !d.is_locked;
  const up = (id) => edit ? `<label class="up">📷 ${(id === "cap" ? d.cap_pic : d.pics[id]) ? "Change" : "Add"} Photo<input type="file" accept="image/*" data-up="${id}"></label>` : "";
  let cards = "";
  for (let i = 0; i < 17; i++){
    const p = d.pics[i];
    cards += `<div><div class="card"><div class="inner">
      <div class="num">${i+1}</div>
      <div class="img">${p ? `<img src="data:image/jpeg;base64,${p}">` : `<svg viewBox="0 0 24 24" fill="none" style="width:50%;opacity:.25"><circle cx="12" cy="8" r="4" stroke="#4060a0" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#4060a0" stroke-width="1.5" stroke-linecap="round"/></svg>`}</div>
      ${d.names[i] ? `<div class="nb">${esc(d.names[i])}</div>` : `<div class="nb e">Player</div>`}
    </div></div>
    ${edit ? `<div class="ed"><input type="text" data-n="${i}" value="${esc(d.names[i])}" placeholder="Player ${i+1}">${up(i)}</div>` : ""}</div>`;
  }
  $("#content").innerHTML = `
  <div class="wrap">
  <div class="th">
    <div class="logo ${d.logo ? "has" : ""}">${d.logo ? `<img src="data:image/jpeg;base64,${d.logo}">` : ""}</div>
    <div><div class="tn gold">${esc(S.tname)}</div><div class="ts">Season 18 2026</div></div>
  </div>
  ${d.is_locked && !S.viewOnly ? `<div class="lock">🔒 Squad is Locked</div>` : ""}
  ${edit ? `<div style="margin-bottom:14px"><label class="l">Team Logo</label><label class="up" style="display:inline-flex;padding:7px 18px">📷 ${d.logo ? "Change" : "Upload"} Logo<input type="file" accept="image/*" data-up="logo"></label></div>` : ""}
  <div class="main">
    <div class="grid">${cards}</div>
    <div><div class="card cap"><div class="inner">
      <div class="cl">★ CAPTAIN ★</div>
      <div class="num" style="top:36px;font-size:13px">18</div>
      <div class="img">${d.cap_pic ? `<img src="data:image/jpeg;base64,${d.cap_pic}">` : `<svg viewBox="0 0 24 24" fill="none" style="width:50%;opacity:.25"><circle cx="12" cy="8" r="4" stroke="#c8a84b" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#c8a84b" stroke-width="1.5" stroke-linecap="round"/></svg>`}</div>
      <div class="nb">${esc(d.cap_name || "Captain")}</div>
    </div></div>
    ${edit ? `<div class="ed"><input type="text" id="cn" value="${esc(d.cap_name)}" placeholder="Captain Name">${up("cap")}</div>` : ""}</div>
  </div>
  <div class="bar">
    <button class="btn sec auto" id="home">🏠 Home</button>
    <button class="btn sec auto" id="dl">📥 Download Image</button>
    ${S.viewOnly ? `<div class="badge">👁 View Only</div>` : `<div class="seg"><button id="vw" class="${edit ? "" : "on"}">👁 View</button><button id="ed" class="${edit ? "on" : ""}" ${d.is_locked ? "disabled" : ""}>✏️ Edit</button></div>`}
    <div class="sp"></div><div class="msg ${S.squadMsg.startsWith("✅") ? "ok" : "err"}" style="margin:0">${S.squadMsg}</div>
    ${edit ? `<button class="btn auto" id="save">💾 Save All Changes</button>` : ""}
  </div>
  </div>`;

  $("#home").onclick = () => { S.nav = "scorer"; mainNav(); };
  if ($("#vw")) { $("#vw").onclick = () => { S.edit = false; S.squadMsg = ""; squad(); }; $("#ed").onclick = () => { S.edit = true; S.squadMsg = ""; squad(); }; }
  $("#dl").onclick = async e => { const b = e.currentTarget; b.textContent = "Preparing…"; try { await downloadImg(); } catch { S.squadMsg = "Could not create image."; } b.textContent = "📥 Download Image"; };
  document.querySelectorAll("[data-n]").forEach(el => el.oninput = () => d.names[+el.dataset.n] = el.value);
  if ($("#cn")) $("#cn").oninput = e => d.cap_name = e.target.value;
  document.querySelectorAll("[data-up]").forEach(el => el.onchange = async () => {
    if (!el.files[0]) return;
    try {
      const k = el.dataset.up;
      const b = await crop(el.files[0], k === "cap" ? 45 / 42 : 1, k === "logo");
      el.value = "";
      if (!b) return;
      if (k === "logo") d.logo = b; else if (k === "cap") d.cap_pic = b; else d.pics[k] = b;
      squad();
    } catch { S.squadMsg = "Could not read image."; squad(); }
  });
  if ($("#save")) $("#save").onclick = async () => {
    $("#save").disabled = true; $("#save").textContent = "Saving…";
    try {
      await setDoc(doc(db, COL, S.team), {
        team_name: S.tname, captain_name: d.cap_name, player_list: d.names,
        squad_pics: d.pics, cap_pic: d.cap_pic, team_logo: d.logo
      }, {merge: true});
      S.squadMsg = "✅ Squad saved successfully!";
    } catch (e) { S.squadMsg = "Save failed: " + e.message; }
    squad();
  };
}
